# Builds Wildin' for macOS (Intel + Apple Silicon): the Wildin'.vst3 plug-in and the Wildin'.component Audio Unit.
# Pushing the 'wildin-build' branch of the slim repository starts it (or use "Run workflow" / a tag like wildin-v1.0.0).
# Uses the same repository secrets as the 2G build (MAC_CERT_*, MAC_SIGN_*, AC_API_*). The result is a signed,
# notarised installer (Wildin-macOS.pkg) that puts the VST3 in /Library/Audio/Plug-Ins/VST3 and the AU in /Library/Audio/Plug-Ins/Components.
name: Wildin macOS build

on:
  workflow_dispatch:
  push:
    tags: ['wildin-v*']
    branches: ['wildin-build']

jobs:
  build:
    runs-on: macos-15
    env:
      HAVE_SIGNING: ${{ secrets.MAC_CERT_APP_P12 != '' && secrets.MAC_CERT_INSTALLER_P12 != '' && secrets.AC_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure (universal, macOS 10.15+)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build plug-ins
        run: cmake --build build --config Release --target wildin_VST3 wildin_AU -j 4

      - name: Locate the products
        run: |
          VST=$(find build -maxdepth 4 -name "*.vst3" | head -1)
          AU=$(find build -maxdepth 4 -name "*.component" | head -1)
          echo "VST3=$PWD/$VST" >> "$GITHUB_ENV"
          echo "AU=$PWD/$AU" >> "$GITHUB_ENV"
          echo "Plug-in: $VST"; echo "Audio Unit: $AU"
          ls "$VST/Contents/MacOS" "$AU/Contents/MacOS"
          lipo -archs "$VST/Contents/MacOS/"*
          lipo -archs "$AU/Contents/MacOS/"*

      - name: Import signing certificates
        if: env.HAVE_SIGNING == 'true'
        env:
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          echo "${{ secrets.MAC_CERT_APP_P12 }}" | base64 --decode > "$RUNNER_TEMP/app.p12"
          echo "${{ secrets.MAC_CERT_INSTALLER_P12 }}" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/app.p12" -P "${{ secrets.MAC_CERT_APP_PASSWORD }}" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security import "$RUNNER_TEMP/installer.p12" -P "${{ secrets.MAC_CERT_INSTALLER_PASSWORD }}" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -k ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          printf '%s' "$AC_API_KEY_P8" | tr -d '\r' > "$RUNNER_TEMP/key.raw"
          if grep -q "BEGIN" "$RUNNER_TEMP/key.raw"; then
            cp "$RUNNER_TEMP/key.raw" "$RUNNER_TEMP/AuthKey.p8"
          else
            tr -d ' \n' < "$RUNNER_TEMP/key.raw" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          fi
          openssl pkey -in "$RUNNER_TEMP/AuthKey.p8" -noout && echo "Notary key parses"

      - name: Sign (Developer ID, hardened runtime) or ad-hoc
        run: |
          if [ "$HAVE_SIGNING" = "true" ]; then
            for item in "$VST3" "$AU"; do
              codesign --force --deep --options runtime --timestamp --sign "${{ secrets.MAC_SIGN_APP_ID }}" "$item"
              codesign --verify --deep --strict --verbose=2 "$item"
            done
          else
            echo "::warning::No Apple signing secrets: ad-hoc signing only."
            for item in "$VST3" "$AU"; do codesign --force --deep --sign - "$item"; done
          fi

      - name: Make the signed installer (.pkg)
        if: env.HAVE_SIGNING == 'true'
        run: |
          mkdir -p root-vst3 root-au
          cp -R "$VST3" root-vst3/
          cp -R "$AU" root-au/
          for part in vst3 au; do
            pkgbuild --analyze --root "root-$part" "$part.plist"
            plutil -replace 0.BundleIsRelocatable -bool false "$part.plist"
          done
          pkgbuild --root root-vst3 --component-plist vst3.plist --identifier com.scrapbrainaudio.wildin.vst3 --version 1.0.0 --install-location /Library/Audio/Plug-Ins/VST3 vst3.pkg
          pkgbuild --root root-au --component-plist au.plist --identifier com.scrapbrainaudio.wildin.au --version 1.0.0 --install-location /Library/Audio/Plug-Ins/Components au.pkg
          productbuild --package vst3.pkg --package au.pkg --sign "${{ secrets.MAC_SIGN_INSTALLER_ID }}" --timestamp Wildin-macOS.pkg

      - name: Notarise and staple
        if: env.HAVE_SIGNING == 'true'
        run: |
          xcrun notarytool submit Wildin-macOS.pkg --key "$RUNNER_TEMP/AuthKey.p8" --key-id "${{ secrets.AC_API_KEY_ID }}" --issuer "${{ secrets.AC_API_ISSUER_ID }}" --wait
          xcrun stapler staple Wildin-macOS.pkg

      - name: Make the unsigned .dmg
        if: env.HAVE_SIGNING != 'true'
        run: |
          mkdir stage
          cp -R "$VST3" stage/
          cp -R "$AU" stage/
          ln -s /Library/Audio/Plug-Ins/VST3 "stage/Drag VST3 here"
          ln -s /Library/Audio/Plug-Ins/Components "stage/Drag component here"
          hdiutil create -volname "Wildin" -srcfolder stage -ov -format UDZO Wildin-macOS.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Wildin-macOS
          retention-days: 1
          path: |
            Wildin-macOS.pkg
            Wildin-macOS.dmg
          if-no-files-found: ignore
