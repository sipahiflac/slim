# Builds 2G for macOS (Intel + Apple Silicon): the standalone 2G.app and the 2G.vst3 plug-in.
# Run it from the Actions tab ("Run workflow"), or push a tag like v1.0.0.
#
# With the signing secrets below the result is a signed, notarised installer (2G-macOS.pkg) that puts 2G.app in
# /Applications and 2G.vst3 in /Library/Audio/Plug-Ins/VST3: customers just open it. Without them it is only an
# ad-hoc signed .dmg that macOS warns about ("cannot be opened" / "damaged") for everyone but the builder.
#
# Repository secrets (Settings > Secrets and variables > Actions; GitHub cannot copy them between repositories):
#   MAC_CERT_APP_P12              "Developer ID Application" certificate (.p12), base64-encoded
#   MAC_CERT_APP_PASSWORD         password of that .p12
#   MAC_SIGN_APP_ID               e.g. Developer ID Application: Your Name (TEAMID)
#   MAC_CERT_INSTALLER_P12        "Developer ID Installer" certificate (.p12), base64-encoded
#   MAC_CERT_INSTALLER_PASSWORD   password of that .p12
#   MAC_SIGN_INSTALLER_ID         e.g. Developer ID Installer: Your Name (TEAMID)
#   AC_API_KEY_P8                 contents of the App Store Connect API key file (AuthKey_XXXX.p8)
#   AC_API_KEY_ID                 that key's ID
#   AC_API_ISSUER_ID              the issuer ID shown on the App Store Connect keys page
name: macOS build

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    # Pushing the 'mac-build' branch starts a build, so the workflow can live on a side branch of an existing
    # repository (the "Run workflow" button only exists for workflows on the default branch).
    branches: ['mac-build']

jobs:
  build:
    runs-on: macos-14
    env:
      HAVE_SIGNING: ${{ secrets.MAC_CERT_APP_P12 != '' && secrets.MAC_CERT_INSTALLER_P12 != '' && secrets.AC_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure (universal, macOS 11+)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build app and plug-in
        run: cmake --build build --config Release --target SyncPhoneArtwork SyncMelodragonWebUI -j 4

      - name: Locate the products
        run: |
          APP=$(find build -maxdepth 4 -name "2G.app" | head -1)
          VST=$(find build -maxdepth 4 -name "2G.vst3" | head -1)
          echo "APP=$PWD/$APP" >> "$GITHUB_ENV"
          echo "VST3=$PWD/$VST" >> "$GITHUB_ENV"
          echo "App: $APP"
          echo "Plug-in: $VST"
          lipo -archs "$APP/Contents/MacOS/2G"
          lipo -archs "$VST/Contents/MacOS/2G"
          ls "$APP/Contents/Resources" | head -5
          ls "$VST/Contents/Resources" | head -5

      - name: Import signing certificates
        if: env.HAVE_SIGNING == 'true'
        env:
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          echo "${{ secrets.MAC_CERT_APP_P12 }}" | base64 --decode > "$RUNNER_TEMP/app.p12"
          echo "${{ secrets.MAC_CERT_INSTALLER_P12 }}" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/app.p12" -P "${{ secrets.MAC_CERT_APP_PASSWORD }}" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security import "$RUNNER_TEMP/installer.p12" -P "${{ secrets.MAC_CERT_INSTALLER_PASSWORD }}" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -k ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          # The App Store Connect key is a PEM file ("-----BEGIN PRIVATE KEY-----"). It may have been stored as the
          # PEM text itself or base64-encoded (like the certificates); accept both, otherwise notarytool fails with
          # "invalidAsn1".
          printf '%s' "$AC_API_KEY_P8" | tr -d '\r' > "$RUNNER_TEMP/key.raw"
          if grep -q "BEGIN" "$RUNNER_TEMP/key.raw"; then
            cp "$RUNNER_TEMP/key.raw" "$RUNNER_TEMP/AuthKey.p8"
          else
            tr -d ' \n' < "$RUNNER_TEMP/key.raw" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          fi
          echo "Notary key header: $(head -1 "$RUNNER_TEMP/AuthKey.p8")"
          openssl pkey -in "$RUNNER_TEMP/AuthKey.p8" -noout && echo "Notary key parses"

      - name: Sign (Developer ID, hardened runtime) or ad-hoc
        run: |
          if [ "$HAVE_SIGNING" = "true" ]; then
            for item in "$VST3" "$APP"; do
              codesign --force --deep --options runtime --timestamp --sign "${{ secrets.MAC_SIGN_APP_ID }}" "$item"
              codesign --verify --deep --strict --verbose=2 "$item"
            done
          else
            echo "::warning::No Apple signing secrets: ad-hoc signing only. Customers will see Gatekeeper warnings."
            for item in "$VST3" "$APP"; do codesign --force --deep --sign - "$item"; done
          fi

      - name: Make the signed installer (.pkg)
        if: env.HAVE_SIGNING == 'true'
        run: |
          mkdir -p root-app root-vst3
          cp -R "$APP" root-app/
          cp -R "$VST3" root-vst3/
          # Not relocatable: always install to the standard folders, never "update" a stray copy elsewhere.
          for part in app vst3; do
            pkgbuild --analyze --root "root-$part" "$part.plist"
            plutil -replace 0.BundleIsRelocatable -bool false "$part.plist"
          done
          pkgbuild --root root-app --component-plist app.plist --identifier com.scrapbrainaudio.2g.app --version 1.0.0 --install-location /Applications app.pkg
          pkgbuild --root root-vst3 --component-plist vst3.plist --identifier com.scrapbrainaudio.2g.vst3 --version 1.0.0 --install-location /Library/Audio/Plug-Ins/VST3 vst3.pkg
          productbuild --package app.pkg --package vst3.pkg --sign "${{ secrets.MAC_SIGN_INSTALLER_ID }}" --timestamp 2G-macOS.pkg

      - name: Notarise and staple
        if: env.HAVE_SIGNING == 'true'
        run: |
          xcrun notarytool submit 2G-macOS.pkg --key "$RUNNER_TEMP/AuthKey.p8" --key-id "${{ secrets.AC_API_KEY_ID }}" --issuer "${{ secrets.AC_API_ISSUER_ID }}" --wait
          xcrun stapler staple 2G-macOS.pkg

      - name: Make the unsigned .dmg
        if: env.HAVE_SIGNING != 'true'
        run: |
          mkdir stage
          cp -R "$APP" stage/
          cp -R "$VST3" stage/
          ln -s /Library/Audio/Plug-Ins/VST3 "stage/Drag 2G.vst3 here"
          ln -s /Applications "stage/Drag 2G.app here"
          hdiutil create -volname "2G" -srcfolder stage -ov -format UDZO 2G-macOS.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: 2G-macOS
          # In a public repository anyone signed in to GitHub can download artifacts: keep them for a day only.
          retention-days: 1
          path: |
            2G-macOS.pkg
            2G-macOS.dmg
          if-no-files-found: ignore
