name: macOS release
 
# Builds, signs, notarises and staples the macOS installer on a GitHub-hosted Mac.
# Nothing here needs a Mac of your own.
#
# Run it from the Actions tab (Run workflow), or by pushing a tag like v1.1.
#
# Required repository secrets:
#   MAC_CERT_APP_P12         base64 of the "Developer ID Application" .p12
#   MAC_CERT_APP_PASSWORD    the password set when exporting that .p12
#   MAC_CERT_INSTALLER_P12   base64 of the "Developer ID Installer" .p12
#   MAC_CERT_INSTALLER_PASSWORD
#   MAC_SIGN_APP_ID          e.g. Developer ID Application: Some Name (AB12CD34EF)
#   MAC_SIGN_INSTALLER_ID    e.g. Developer ID Installer: Some Name (AB12CD34EF)
#   AC_API_KEY_P8            base64 of the App Store Connect API key .p8
#   AC_API_KEY_ID            the key's 10-character ID
#   AC_API_ISSUER_ID         the issuer UUID from App Store Connect
#
# To make a base64 secret from a file, on any machine:
#   base64 -i cert.p12 | pbcopy        (macOS)
#   certutil -encode cert.p12 out.txt  (Windows, then strip the BEGIN/END lines)
 
# SECURITY, for a public repository: secrets are never part of the repo, and
# GitHub withholds them from pull_request runs raised from forks - so a stranger
# cannot get at the certificates by opening a PR that edits this file.
#
# Never add `pull_request_target` or `workflow_run` here. Those two run code from
# a fork in this repository's own context, WITH access to the secrets, and they
# are how essentially every real-world secret leak has happened. The triggers
# below both require write access, so only you can start a run.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
 
# The automatic token gets read-only access; nothing here needs to write.
permissions:
  contents: read
 
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90
 
    env:
      PRODUCT: WX
      PKG_ID: com.scrapbrainsound.stablealive.pkg
 
    steps:
      - uses: actions/checkout@v4
 
      - name: Read version from CMakeLists
        id: ver
        run: |
          VERSION=$(sed -n 's/^project(WX VERSION \([0-9.]*\)).*/\1/p' CMakeLists.txt)
          echo "version=${VERSION:-1.0.0}" >> "$GITHUB_OUTPUT"
 
      # JUCE is fetched by CMake on every run; caching it turns a ~6 minute
      # download and configure into a few seconds.
      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-${{ hashFiles('CMakeLists.txt') }}
 
      - name: Import signing certificates
        env:
          APP_P12: ${{ secrets.MAC_CERT_APP_P12 }}
          APP_PW: ${{ secrets.MAC_CERT_APP_PASSWORD }}
          INST_P12: ${{ secrets.MAC_CERT_INSTALLER_P12 }}
          INST_PW: ${{ secrets.MAC_CERT_INSTALLER_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PW=$(uuidgen)
 
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
 
          echo "$APP_P12"  | base64 --decode > "$RUNNER_TEMP/app.p12"
          echo "$INST_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
 
          security import "$RUNNER_TEMP/app.p12"       -k "$KEYCHAIN" -P "$APP_PW"  -T /usr/bin/codesign -T /usr/bin/productbuild
          security import "$RUNNER_TEMP/installer.p12" -k "$KEYCHAIN" -P "$INST_PW" -T /usr/bin/codesign -T /usr/bin/productbuild
 
          # Let codesign use the keys without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
 
          rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"
 
      - name: Build (universal arm64 + x86_64)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j3
 
      - name: Sign the plug-ins
        env:
          SIGN_APP: ${{ secrets.MAC_SIGN_APP_ID }}
        run: |
          ART="build/${PRODUCT}_artefacts/Release"
          for BUNDLE in "$ART/VST3/$PRODUCT.vst3" "$ART/AU/$PRODUCT.component" "$ART/Standalone/$PRODUCT.app"; do
            [ -d "$BUNDLE" ] || { echo "skipping missing $BUNDLE"; continue; }
            # Extended attributes make codesign refuse the bundle outright.
            xattr -cr "$BUNDLE"
            find "$BUNDLE" -name '.DS_Store' -delete
            codesign --force --timestamp --options runtime --sign "$SIGN_APP" "$BUNDLE"
            codesign --verify --deep --strict "$BUNDLE"
            echo "signed $(basename "$BUNDLE")"
          done
 
      - name: Build the installer
        env:
          SIGN_INSTALLER: ${{ secrets.MAC_SIGN_INSTALLER_ID }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          ART="build/${PRODUCT}_artefacts/Release"
          STAGE="$RUNNER_TEMP/pkg"
          mkdir -p "$STAGE" dist
 
          # One component package per install location. BundleIsRelocatable is
          # turned off: left on, the installer overwrites any copy it finds
          # elsewhere on the disk instead of installing where we asked.
          component () {   # component <bundle> <install-dir> <name> 
            [ -d "$1" ] || return 0
            mkdir -p "$STAGE/$3-root$2"
            cp -R "$1" "$STAGE/$3-root$2/"
            pkgbuild --analyze --root "$STAGE/$3-root" "$STAGE/$3.plist"
            plutil -replace BundleIsRelocatable -bool NO "$STAGE/$3.plist" || true
            pkgbuild --root "$STAGE/$3-root" --component-plist "$STAGE/$3.plist" \
                     --identifier "$PKG_ID.$3" --version "$VERSION" \
                     --install-location "/" "$STAGE/$3.pkg"
            echo "$3" >> "$STAGE/components.txt"
          }
          component "$ART/VST3/$PRODUCT.vst3"       /Library/Audio/Plug-Ins/VST3       vst3
          component "$ART/AU/$PRODUCT.component"    /Library/Audio/Plug-Ins/Components au
          component "$ART/Standalone/$PRODUCT.app"  /Applications                      standalone
 
          {
            echo '<?xml version="1.0" encoding="utf-8"?>'
            echo '<installer-gui-script minSpecVersion="2">'
            echo "  <title>$PRODUCT $VERSION</title>"
            echo '  <options customize="always" hostArchitectures="arm64,x86_64"/>'
            echo '  <domains enable_localSystem="true"/>'
            echo '  <choices-outline>'
            while read -r c; do echo "    <line choice=\"$c\"/>"; done < "$STAGE/components.txt"
            echo '  </choices-outline>'
            while read -r c; do
              case "$c" in
                vst3)       t="VST3 plug-in" ;;
                au)         t="Audio Unit" ;;
                standalone) t="Standalone app" ;;
              esac
              echo "  <choice id=\"$c\" title=\"$t\" visible=\"true\" start_selected=\"true\"><pkg-ref id=\"$PKG_ID.$c\"/></choice>"
              echo "  <pkg-ref id=\"$PKG_ID.$c\" version=\"$VERSION\">$c.pkg</pkg-ref>"
            done < "$STAGE/components.txt"
            echo '</installer-gui-script>'
          } > "$STAGE/distribution.xml"
 
          productbuild --distribution "$STAGE/distribution.xml" --package-path "$STAGE" \
                       --sign "$SIGN_INSTALLER" --timestamp "dist/$PRODUCT-$VERSION.pkg"
          pkgutil --check-signature "dist/$PRODUCT-$VERSION.pkg"
 
      - name: Notarise and staple
        env:
          KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
          KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          ISSUER: ${{ secrets.AC_API_ISSUER_ID }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          echo "$KEY_P8" | base64 --decode > "$RUNNER_TEMP/ac_key.p8"
          PKG="dist/$PRODUCT-$VERSION.pkg"
 
          xcrun notarytool submit "$PKG" \
            --key "$RUNNER_TEMP/ac_key.p8" --key-id "$KEY_ID" --issuer "$ISSUER" \
            --wait --timeout 45m
 
          xcrun stapler staple "$PKG"
          xcrun stapler validate "$PKG"
          spctl --assess --type install -vv "$PKG" || true
          rm -f "$RUNNER_TEMP/ac_key.p8"
 
      - name: Validate the Audio Unit
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/${PRODUCT}_artefacts/Release/AU/$PRODUCT.component" ~/Library/Audio/Plug-Ins/Components/ || exit 0
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -v aumu Stbl Anti
 
      - uses: actions/upload-artifact@v4
        with:
          name: WX-macOS-${{ steps.ver.outputs.version }}
          path: dist/*.pkg
